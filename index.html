<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CCFOLIA LOG BACKUP EDITOR COMPLETE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&family=Orbit&display=swap" rel="stylesheet">

<style>
/* =========================================================
  0. Base
========================================================= */
:root{
  --page:#ece6de;
  --panel:#fffdf8;
  --ink:#29231f;
  --muted:#7e746c;
  --line:#ddd3c8;
  --accent:#806a58;
  --cc-bg:#303136;
  --cc-text:#eeeeee;
  --cc-meta:rgba(255,255,255,.45);
  --cc-system:rgba(255,255,255,.68);
  --log-font:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Arial","Noto Sans KR",sans-serif;
  --log-font-size:14px;
  --dice-font-size:13px;
  --system-font-size:13px;
  --system-weight:400;
  --system-style:normal;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(#fbf5ee,var(--page));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(1540px,calc(100% - 20px));margin:0 auto;padding:16px 0 36px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(22px,3vw,34px)}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.version{font-size:12px;font-weight:800;color:#5e4d41;white-space:nowrap}

/* =========================================================
  1. Layout / controls
========================================================= */
.mobile-menu-bar{display:none;margin:0 0 10px}
.mobile-menu-bar button{width:100%;border-radius:12px;padding:11px 14px;font-size:14px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;align-items:start}
.panel{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(255,253,248,.96);box-shadow:0 14px 34px rgba(65,45,25,.08)}
.left-panel{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.section{padding:13px}
.section+.section{border-top:1px solid var(--line)}
details.option-group{border-top:1px solid var(--line)}
details.option-group:first-child{border-top:0}
details.option-group>summary{padding:13px;font-size:14px;font-weight:900;color:#5e4d41;cursor:pointer;list-style:none}
details.option-group>summary::-webkit-details-marker{display:none}
details.option-group>summary::before{content:"▶";display:inline-block;margin-right:7px;font-size:10px;transform:translateY(-1px)}
details.option-group[open]>summary::before{content:"▼"}
.option-body{padding:0 13px 13px}
h2{margin:0 0 9px;color:#5e4d41;font-size:14px}
label{display:block;margin:9px 0 5px;color:var(--muted);font-size:12px;font-weight:800}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:13px}
textarea{min-height:68px;resize:vertical}
input[type=color]{height:36px;padding:3px}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.hint{margin:7px 0;color:var(--muted);font-size:12px;line-height:1.5}
.note{padding:9px;border:1px solid #eadbcd;border-radius:10px;background:#fff7ef;color:#6f6259;font-size:12px;line-height:1.55}
code{padding:1px 4px;border-radius:4px;background:#eee1d6}
.progress{max-height:120px;overflow:auto;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:12px;line-height:1.45}
.hidden{display:none!important}
button{display:inline-flex;justify-content:center;align-items:center;gap:5px;padding:8px 11px;border:1px solid var(--accent);border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:800}
button.ghost{background:#fff;color:#5e4d41}
button.gray{background:#777;border-color:#777}
button.danger{background:#9a3a34;border-color:#9a3a34}
button.small{padding:4px 8px;font-size:11px}
.chip{display:flex;gap:6px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:700}
.list{display:grid;gap:7px;max-height:260px;overflow:auto;padding:7px;border:1px solid var(--line);border-radius:9px;background:#fff}
.tab-color-row{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:center}
.character-summary{display:grid;gap:6px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fffaf4}
.character-summary button{justify-content:flex-start}

/* =========================================================
  2. Preview
========================================================= */
.toolbar{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.preview{min-height:760px;padding:18px 12px 40px;background:var(--cc-bg);color:var(--cc-text);font-family:var(--log-font)}
body>.preview,body>.tistory-ccfolia-backup.preview{min-height:100vh;width:100%}
.empty{display:grid;place-items:center;min-height:560px;color:rgba(255,255,255,.55);text-align:center}
.cc-row{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;max-width:1040px;margin:0 auto 7px;text-align:left}
.cc-row.system,.cc-row.dice-log{display:block;max-width:1040px;margin:9px auto;text-align:center}
.cc-avatar{width:48px;height:48px;overflow:hidden;border-radius:3px}
.cc-avatar img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center}
.cc-body{position:relative;padding-right:30px}
.cc-name-line{display:flex;gap:8px;align-items:baseline;margin:0 0 2px}
.cc-name{font-size:13px;font-weight:700}
.cc-meta{color:var(--cc-meta);font-size:11px}
.cc-text{margin:0;padding:0;color:var(--cc-text);font-size:var(--log-font-size);line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;text-align:left}
.cc-row.system .cc-text{font-size:var(--system-font-size);color:var(--cc-system);font-weight:var(--system-weight);font-style:var(--system-style);text-align:center}
.cc-row.system.system-box .cc-text{display:inline-block;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.06)}
.cc-row.system.system-left{text-align:left}
.cc-row.system.system-left .cc-text{text-align:left}
.cc-row.dice-log .cc-text{display:inline-block;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.035);font-size:var(--dice-font-size);text-align:center}
.cc-row.dice-log.dice-gray .cc-text{color:rgba(255,255,255,.62)!important}
.cc-row.dice-log.dice-character .cc-text{color:var(--dice-color,rgba(255,255,255,.64))!important}
.cc-row.dice-log.dice-simple .cc-text{background:transparent;color:var(--cc-text)!important}
.cc-row.dice-log .cc-avatar,.cc-row.dice-log .cc-name-line{display:none}
.dice-name{
  display:block;
  margin-bottom:4px;
  font-size:12px;
  font-weight:700;
  color:var(--dice-color,currentColor);
  opacity:.95;
}
.dice-name.hide{display:none}
.dice-result{border-radius:3px}
.dice-result.bold-bg{font-weight:900;background:rgba(255,255,255,.12);padding:0 3px}
.dice-result.bold-only{font-weight:900;background:transparent;padding:0}
.dice-result.character{
  color:var(--dice-color,currentColor) !important;
}
.dice-result.none{font-weight:400;background:transparent;padding:0}
.standing-image{display:block;width:var(--standing-width,180px);height:var(--standing-height,auto);margin:4px 0 6px;object-fit:var(--standing-fit,contain);object-position:var(--standing-x,50%) var(--standing-y,50%);transform-origin:center;box-shadow:none}
.custom-block{position:relative;max-width:1040px;margin:10px auto 14px;text-align:center}
.insert-image{display:block;width:var(--img-width,70%);max-width:1040px;height:var(--img-height,auto);margin:8px auto 12px;border-radius:4px;object-fit:var(--img-fit,contain);object-position:var(--img-x,50%) var(--img-y,50%);transform-origin:center;box-shadow:0 2px 8px rgba(0,0,0,.22)}
.caption{color:var(--cc-meta);font-size:12px}
.bgm-area{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:1040px;margin:8px auto 12px}
.bgmButton{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.08);color:#fff}

/* =========================================================
  3. Right action menu / editor
========================================================= */
.action-toggle{position:absolute;right:0;top:0;width:24px;min-height:24px!important;padding:0!important;border-radius:999px!important;border-color:rgba(255,255,255,.18)!important;background:rgba(255,255,255,.06)!important;color:rgba(255,255,255,.75)!important;font-size:14px!important;line-height:1!important}
.inline-tools{display:none!important;position:absolute;right:0;top:26px;z-index:15;min-width:172px;padding:6px;border-radius:10px;background:rgba(35,35,38,.96);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.inline-tools.active{display:grid!important;gap:5px}
.inline-tools button{justify-content:flex-start;width:100%}
.inline-editor{display:grid;gap:6px;margin-top:7px;padding:8px;border:1px solid rgba(0,0,0,.15);border-radius:8px;background:rgba(255,255,255,.96)}
.inline-editor input,.inline-editor textarea,.inline-editor select{padding:6px;border:1px solid rgba(0,0,0,.18);border-radius:5px;background:#fff;color:#222;font-size:12px}
.format-row{display:flex;gap:6px;flex-wrap:wrap}
.format-row button{flex:0 0 auto}

/* =========================================================
  4. Modal
========================================================= */
.modal-backdrop{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(0,0,0,.46)}
.modal-box{width:min(560px,calc(100% - 28px));max-height:calc(100vh - 28px);overflow:auto;padding:16px;border:1px solid #ddd3c8;border-radius:14px;background:#fffdf8;color:#29231f;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.modal-box h3{margin:0 0 10px;font-size:16px}
.standing-button-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.standing-button-list button{flex:0 1 auto;max-width:100%}
.standing-preview{width:100%;max-height:180px;object-fit:contain;border-radius:8px;background:#eee}
.image-adjust-box{position:relative;width:100%;height:210px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#222;cursor:grab}
.image-adjust-box img{width:100%;height:100%;object-fit:cover;object-position:var(--modal-x,50%) var(--modal-y,50%);transform:scale(var(--modal-scale,1));user-select:none;pointer-events:none}

/* =========================================================
  5. Skins / Tistory
========================================================= */
.skin-light{--cc-bg:#eeeeee;--cc-text:#333;--cc-meta:rgba(0,0,0,.42);--cc-system:#777}
.skin-tistory{--cc-bg:#f7f3ee;--cc-text:#2d2926;--cc-meta:rgba(0,0,0,.42);--cc-system:#7a7169}
.skin-paper{--cc-bg:#eee4d5;--cc-text:#312922;--cc-meta:rgba(0,0,0,.42);--cc-system:#6d6258}
.tistory-ccfolia-backup{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;overflow:hidden!important;border-radius:0!important}
.tistory-ccfolia-backup *{max-width:100%}

/* =========================================================
  6. Mobile
========================================================= */
@media(max-width:900px){
  body{background:var(--cc-bg)}
  .app{width:100%;padding:0}
  header{display:block;padding:12px 14px;margin:0;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:20px;line-height:1.25}
  .sub{font-size:12px}.version{display:none}
  .mobile-menu-bar{display:block;position:sticky;top:0;z-index:50;padding:8px;background:var(--panel);border-bottom:1px solid var(--line)}
  .layout{display:block}
  .left-panel{display:none;position:fixed;inset:52px 8px 8px 8px;z-index:120;max-height:none;overflow:auto;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  body.menu-open .left-panel{display:block}
  body.menu-open::after{content:"";position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.38)}
  body.menu-open .mobile-menu-bar{z-index:130}
  .viewer{border:0;border-radius:0;box-shadow:none}
  .toolbar{position:sticky;top:54px;z-index:20;padding:8px 10px;background:rgba(255,253,248,.96);font-size:11px}
  .preview{min-height:calc(100vh - 92px);padding:12px 8px 32px}
  .cc-row{grid-template-columns:42px minmax(0,1fr);gap:7px;margin-bottom:8px}
  .cc-avatar{width:36px;height:36px}
  .cc-body{padding-right:26px}
  .cc-name{font-size:12px}.cc-meta{font-size:10px}
  .cc-text{font-size:13px!important;line-height:1.55}
  .cc-row.dice-log .cc-text,.cc-row.system .cc-text{font-size:12px!important}
  .inline-tools{position:static;margin-top:5px}
  .modal-box{width:calc(100% - 22px);max-height:calc(100vh - 22px);padding:14px}
  .grid2,.grid3{grid-template-columns:1fr}
  .row{display:grid;grid-template-columns:1fr}
  .list{max-height:260px}
  .insert-image{width:min(100%,var(--img-width,92%))}
  .standing-image{max-width:55vw}
}

/* =========================================================
  UX final patch 2
========================================================= */
:root{
  --log-line-height:1.55;
  --log-width:1040px;
}
.cc-row,
.custom-block{
  max-width:var(--log-width)!important;
}
.cc-text{
  line-height:var(--log-line-height)!important;
}
.cc-row.compact .cc-avatar,
.cc-row.compact .cc-name-line{
  visibility:hidden;
  height:0;
  min-height:0;
  margin:0;
}
.cc-row.dragging,
.custom-block.dragging{
  opacity:.45;
  outline:2px dashed rgba(255,255,255,.35);
}
.cc-row,
.custom-block{
  touch-action:manipulation;
}
.character-icon-preview{
  width:72px;
  height:72px;
  object-fit:cover;
  object-position:var(--icon-x,50%) var(--icon-y,50%);
  transform:scale(var(--icon-scale,1));
  border-radius:4px;
  background:#eee;
  display:block;
  margin:6px 0;
}
.avatar-adjust-box{
  width:150px;
  height:150px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:10px;
  background:#222;
  cursor:grab;
}
.avatar-adjust-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:var(--modal-x,50%) var(--modal-y,50%);
  transform:scale(var(--modal-scale,1));
  user-select:none;
  pointer-events:none;
}
.inline-preview{
  padding:8px;
  border:1px solid rgba(0,0,0,.15);
  border-radius:6px;
  background:#303136;
  color:#eee;
  font-family:var(--log-font);
  font-size:var(--log-font-size);
  line-height:var(--log-line-height);
  white-space:pre-wrap;
}
.inline-editor .format-row input[type=color]{
  width:42px;
  flex:0 0 42px;
}
@media(max-width:900px){
  .cc-row,.custom-block{max-width:100%!important}
}

/* =========================================================
  Stability patch 3
========================================================= */
.modal-backdrop.stable {
  pointer-events: auto;
}
.modal-box {
  pointer-events: auto;
}
.crop-adjust-box {
  width: 240px;
  height: 240px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background:
    linear-gradient(45deg,#ddd 25%,transparent 25%),
    linear-gradient(-45deg,#ddd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ddd 75%),
    linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size: 18px 18px;
  background-position: 0 0,0 9px,9px -9px,-9px 0;
  cursor: grab;
  margin: 8px 0;
}
.crop-adjust-box:active {
  cursor: grabbing;
}
.crop-adjust-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--crop-x,50%) var(--crop-y,50%);
  transform: scale(var(--crop-scale,1));
  transform-origin: center;
  pointer-events: none;
  user-select: none;
}
.inline-color-tools {
  display: flex;
  gap: 6px;
  align-items: center;
}
.inline-color-tools input[type=color] {
  width: 46px;
  flex: 0 0 46px;
}
.inline-editor .save-row {
  display: flex;
  gap: 6px;
}
.inline-editor .save-row button {
  flex: 1;
}

/* Avatar box size patch */
:root { --avatar-size:48px; }
.cc-row {
  grid-template-columns: calc(var(--avatar-size) + 6px) minmax(0,1fr) !important;
}
.cc-avatar {
  width: var(--avatar-size) !important;
  height: var(--avatar-size) !important;
}
@media(max-width:900px){
  .cc-row {
    grid-template-columns: calc(var(--avatar-size) + 4px) minmax(0,1fr) !important;
  }
}

/* =========================================================
  Patch5: requested fonts, Tistory-ish width, tab colors, handouts
========================================================= */
@font-face {
  font-family: 'KCC-Kimhwanki';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201@1.0/KCC-Kimhwanki.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
@font-face {
  font-family: 'OngleipYoonwoo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105@1.1/Yoonwoo.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
@font-face {
  font-family: 'DungGeunMo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Chosunilbo_myungjo';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/Chosunilbo_myungjo.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
:root {
  --log-width: 760px;
}
.outputTabLabel {
  border-color: var(--tab-color, var(--line)) !important;
  box-shadow: inset 4px 0 0 var(--tab-color, transparent);
}
.cc-row.tab-colored:not(.system):not(.dice-log):not(.handout-row) {
  border-left: 3px solid var(--tab-color, transparent);
  padding-left: 7px;
}
.custom-block.tab-colored {
  border-left: 3px solid var(--tab-color, transparent);
  padding-left: 7px;
}
.cc-row.handout-row {
  display: block;
  max-width: var(--log-width) !important;
  margin: 14px auto;
  text-align: left;
}
.handout-card {
  position: relative;
  padding: 16px 18px;
  color: #2e2722;
  line-height: var(--log-line-height);
  white-space: pre-wrap;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.handout-card.handout-basic {
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 8px;
  background: rgba(255,255,255,.08);
  color: var(--cc-text);
}
.handout-card.handout-memo {
  border: 1px solid #e7d28f;
  border-radius: 4px;
  background:
    linear-gradient(transparent 31px, rgba(180,140,60,.17) 32px),
    #fff6bd;
  background-size: 100% 32px;
  color: #3b2f1e;
  transform: rotate(-0.25deg);
}
.handout-card.handout-paper {
  border: 1px solid #d7c8ad;
  border-radius: 2px;
  background:
    radial-gradient(circle at 18px 18px, rgba(120,90,50,.08), transparent 24px),
    linear-gradient(90deg, rgba(120,90,50,.09), transparent 55px),
    #f7f0df;
  color: #2f2920;
}
.handout-label {
  display: inline-block;
  margin: 0 0 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(0,0,0,.12);
  color: inherit;
  font-size: 11px;
  font-weight: 900;
  opacity: .75;
}
.handout-card .action-toggle {
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,.15) !important;
}
.handout-card .inline-tools {
  top: 34px;
  right: 8px;
}
.add-below-menu {
  display: grid;
  gap: 5px;
}
@media(max-width:900px){
  :root { --log-width: 100%; }
  .handout-card { padding: 14px 14px; }
}

/* =========================================================
  Patch6: tab color toggle + quiet chat tab
========================================================= */
.no-tab-color .tab-colored,
.no-tab-color .outputTabLabel {
  border-left-color: transparent !important;
  box-shadow: none !important;
}
.no-tab-color .cc-row.tab-colored:not(.system):not(.dice-log):not(.handout-row),
.no-tab-color .custom-block.tab-colored {
  border-left: 0 !important;
  padding-left: 0 !important;
}
.cc-row.quiet-tab:not(.handout-row) {
  opacity: .58;
  transform-origin: left top;
}
.cc-row.quiet-tab:not(.system):not(.dice-log) .cc-text {

<body>

<script>
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderGroupedMessagePatch(messages, c) {
  if(!messages||!messages.length) return '';
  const first=messages[0];
  const avatarMode=document.getElementById('avatarMode')?.value||'show';
  
  let avatar='';
  if(avatarMode==='show'){
    const url=first.avatarUrl||c?.avatarUrl||'';
    if(url) {
      avatar='<div class="cc-avatar"><img src="'+esc(url)+'" style="'+avatarTransformPatch(first,c)+'"></div>';
    } else {
      avatar='<div class="cc-avatar" style="background:#555"></div>';
    }
  }
  
  const displayName=first.name||c?.name||esc(first.characterId||'');
  const meta=first.timestamp?new Date(first.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
  const nameLine='<div class="cc-name-line"><span class="cc-name" style="color:'+esc(first.color||c?.color||'#fff')+'">'+esc(displayName)+'</span>'+(meta?'<span class="cc-meta">'+esc(meta)+'</span>':'')+'</div>';
  
  const textHtml=messages.map((m)=>{
    return '<p class="cc-text" data-sub-id="'+esc(m.id)+'" '+textFontAttrPatch(m)+textColorStylePatch(m)+'>'+inlineFormat(m.text)+'</p>';
  }).join('');
  
  const tools=typeof actionToolsForGroupedPatch==='function'?actionToolsForGroupedPatch(first.id,messages):'';
  const groupEditor=typeof groupEditorHtmlPatch==='function'?groupEditorHtmlPatch(first.id,messages):'';
  
  return '<article class="cc-row grouped-message" style="--dice-color:'+esc(first.color||c?.color||'rgba(255,255,255,.64)')+'" data-id=\"'+esc(first.id)+'\" data-kind=\"message\" draggable=\"false\">'+
    avatar+'<div class="cc-body">'+nameLine+textHtml+tools+groupEditor+'</div></article>';
}

// [핵심 엔진 리빌드 및 버그 전면 수정 완료]
if (typeof renderMessage === 'function') {
  const __oldRenderMessageFontPatch = renderMessage;
  renderMessage = function(message, set) {
    let output = __oldRenderMessageFontPatch(message, set);
    
    // 1. [옵션 연동성 개선] 주사위 로그 분리 여부와 상관없이 무조건 폰트, 색상, 강조 옵션이 동기화되도록 수정
    const styles = [];
    if (message?.textColor) styles.push('color:' + esc(message.textColor));
    if (message?.fontMode) {
      styles.push('--message-font-family:' + esc(cssFontVarPatch(message.fontMode)));
      styles.push('font-family:var(--message-font-family)');
    }
    if (styles.length) {
      output = output.replace('class="cc-text"', 'class="cc-text" style="' + styles.join(';') + '"');
      output = output.replace('class="cc-name"', 'class="cc-name" style="' + styles.join(';') + '"');
      output = output.replace('class="cc-system"', 'class="cc-system" style="' + styles.join(';') + '"');
    }

    // 2. [강조 제어 권한 복구] 강조 안 하기 옵션을 켰을 때 cc<=80 관찰력 등 주사위 문구가 멋대로 굵어지는 현상 차단
    const diceBoldMode = document.getElementById('diceBoldMode')?.value || 'bold'; 
    if (diceBoldMode === 'none') {
      // 강제 굵은 글씨 스타일(dice-hit, bold-bg, bold-only 등)이 있으면 일반 가독성 모드로 치환
      output = output.replace(/class="([^"]*)\b(dice-hit|bold-bg|bold-only)\b([^"]*)"/g, 'class="$1none$3"');
      output = output.replace(/font-weight:\s*900/g, 'font-weight:400');
    }

    // 3. [이름 추적 엔진 완전 자동화] 기존 고정값(츠루기 켄지) 파괴하고 데이터에 기반한 진짜 캐릭터 이름 추출
    try {
      const diceNameMode = document.getElementById('diceNameMode')?.value || 'show';
      if (diceNameMode === 'show' && output.includes('class="cc-text"') && !output.includes('class="cc-name"')) {
        
        let realCharName = '';
        
        // 데이터 오브젝트나 상위 설정 셋에서 이름을 역추적
        if (message?.name) {
          realCharName = message.name;
        } else if (set && Array.isArray(set)) {
          // 동일 그룹 타임라인 매칭 추적
          const matchMsg = set.find(m => m && m.id === message.id);
          if (matchMsg && matchMsg.name) realCharName = matchMsg.name;
        }
        
        // 그래도 비어있다면 브라우저 렌더링 노드 히스토리에서 가장 최신의 캐릭터 이름을 안전하게 낚아챔
        if (!realCharName) {
          const rows = document.querySelectorAll('.cc-row');
          if (rows.length > 0) {
            for (let i = rows.length - 1; i >= 0; i--) {
              const nameEl = rows[i].querySelector('.cc-name');
              if (nameEl && nameEl.textContent.trim()) {
                realCharName = nameEl.textContent.trim();
                break;
              }
            }
          }
        }
        
        // 최종 획득한 진짜 이름으로 말풍선 상단 패치 가동
        if (realCharName) {
          const nameTag = '<span class="dice-bubble-name" style="display: block; font-weight: bold; margin-bottom: 6px; color: #ffffff; opacity: 0.9; font-size: 13px;">[' + esc(realCharName) + ']</span>';
          const textTagMatch = output.match(/<p class="cc-text"[^>]*>/);
          if (textTagMatch) {
            const insertIdx = output.indexOf(textTagMatch[0]) + textTagMatch[0].length;
            output = output.substring(0, insertIdx) + nameTag + output.substring(insertIdx);
          }
        }
      }
    } catch (e) {
      console.error("주사위 캐릭터 이름 복구 엔진 예외 처리:", e);
    }

    return output;
  };
}
</script>
