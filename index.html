<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCFOLIA LOG BACKUP EDITOR</title>
<style>
:root{--page:#ece6de;--panel:#fffdf8;--ink:#29231f;--muted:#7e746c;--line:#ddd3c8;--accent:#806a58;--cc-bg:#303136;--cc-text:#eee;--cc-name:#f4f4f4;--cc-meta:rgba(255,255,255,.45);--cc-system:rgba(255,255,255,.68)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbf5ee,var(--page));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{width:min(1500px,calc(100% - 20px));margin:auto;padding:16px 0 36px}header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:10px}h1{margin:0;font-size:clamp(23px,3vw,36px)}.sub{margin:5px 0 0;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:300px 1fr;gap:12px}.panel{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(65,45,25,.08)}.left{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}.section{padding:13px}.section+.section{border-top:1px solid var(--line)}h2{font-size:14px;margin:0 0 9px;color:#5e4d41}label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin:9px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;color:var(--ink);font:inherit;font-size:13px}textarea{min-height:58px;resize:vertical}input[type=color]{height:36px;padding:3px}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:8px 11px;font:inherit;font-weight:800;cursor:pointer;font-size:12px}button.ghost{background:#fff;color:#5e4d41}button.gray{background:#777;border-color:#777}button.danger{background:#9a3a34;border-color:#9a3a34}.small{padding:4px 8px;font-size:11px}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:7px 0}.progress{font-size:12px;color:var(--muted);max-height:110px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:8px}.hidden{display:none!important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 8px;background:#fff;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700}.list{display:grid;gap:7px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px}.tab-color-row{display:grid;grid-template-columns:1fr 44px;gap:6px}.toolbar{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.preview{min-height:760px;padding:18px 12px 40px;background:var(--cc-bg);color:var(--cc-text)}.empty{min-height:560px;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.55)}.log-title{max-width:1040px;margin:0 auto 14px;text-align:center;color:rgba(255,255,255,.72);font-weight:800;font-size:13px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}.insert-toggle{max-width:1040px;margin:0 auto 2px;text-align:center;opacity:.18}.insert-toggle:hover{opacity:1}.insert-toggle button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#fff;padding:2px 8px;font-size:10px}.insert-control{max-width:1040px;margin:0 auto 8px;display:none;gap:6px}.insert-control.active{display:flex}.insert-control button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}.cc-row{max-width:1040px;margin:0 auto 6px;display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:start}.cc-row.system,.cc-row.dice-log{display:block;text-align:center;margin:8px auto}.cc-avatar{width:48px;height:48px;border-radius:3px;overflow:hidden}.cc-avatar img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}.cc-name-line{display:flex;gap:8px;align-items:baseline;margin:0 0 2px}.cc-name{font-size:13px;font-weight:700;color:var(--cc-name)}.cc-meta{font-size:11px;color:var(--cc-meta)}.cc-text{white-space:pre-wrap;line-height:1.55;font-size:14px;color:var(--cc-text);margin:0}.cc-row.compact .cc-avatar,.cc-row.compact .cc-name-line{visibility:hidden;height:0;min-height:0;margin:0}.cc-row.system .cc-text{color:var(--cc-system);font-size:13px}.cc-row.dice-log .cc-text{display:inline-block;color:var(--dice-color,rgba(255,255,255,.64))!important;background:rgba(255,255,255,.035);border-radius:4px;padding:3px 8px;font-size:13px}.cc-row.dice-log .cc-avatar,.cc-row.dice-log .cc-name-line{display:none}.inline-tools{display:none;gap:5px;margin-top:4px;flex-wrap:wrap}.cc-name-line:hover+.cc-text+.inline-tools,.cc-text:hover+.inline-tools,.custom-block:hover .inline-tools{display:flex}.inline-editor{display:grid;gap:5px;margin-top:6px;background:rgba(255,255,255,.94);border-radius:6px;padding:7px;border:1px solid rgba(0,0,0,.15)}.inline-editor input,.inline-editor textarea{font-size:12px;border:1px solid rgba(0,0,0,.18);border-radius:4px;padding:6px;background:#fff;color:#222}.dice-result{font-weight:900}.dice-macro{font-weight:600}.custom-block{max-width:1040px;margin:8px auto 12px;text-align:center}.insert-image{display:block;width:var(--img-width,70%);max-width:1040px;margin:8px auto 12px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.22)}.caption{font-size:12px;color:var(--cc-meta)}.bgm-area{max-width:1040px;margin:8px auto 12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.bgmButton{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.08);color:#fff}.skin-light{--cc-bg:#eee;--cc-name:#333;--cc-text:#333;--cc-meta:rgba(0,0,0,.42);--cc-system:#777}.skin-tistory{--cc-bg:#f7f3ee;--cc-name:#2d2926;--cc-text:#2d2926;--cc-meta:rgba(0,0,0,.42);--cc-system:#7a7169}.skin-paper{--cc-bg:#eee4d5;--cc-name:#312922;--cc-text:#312922;--cc-meta:rgba(0,0,0,.42);--cc-system:#6d6258}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.46);display:grid;place-items:center;z-index:9999}.modal-box{width:min(420px,calc(100% - 28px));background:#fffdf8;color:#29231f;border-radius:14px;border:1px solid #ddd3c8;box-shadow:0 18px 60px rgba(0,0,0,.35);padding:16px}.modal-box h3{margin:0 0 10px;font-size:16px}@media(max-width:900px){.app{width:100%;padding:0}.layout{grid-template-columns:1fr}.left{position:relative;top:auto;max-height:none;border-radius:0}.preview{min-height:70vh;padding:14px 7px 32px}.cc-row{grid-template-columns:42px 1fr;gap:7px}.cc-avatar{width:38px;height:38px}.cc-text{font-size:13px!important}.grid2{grid-template-columns:1fr}.inline-tools{display:flex}.insert-image{width:min(100%,var(--img-width,80%))}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>CCFOLIA LOG BACKUP EDITOR</h1><p class="sub">선택한 탭들을 시간순으로 합쳐 출력합니다.</p></div><div class="version">stable</div></header>
<div class="layout">
<aside class="panel left">
<div class="section"><h2>1. 룸 불러오기</h2><label>룸 주소 / 룸 ID</label><input id="roomInput" type="text" placeholder="https://ccfolia.com/rooms/... 또는 ID"><div class="row" style="margin-top:8px"><button id="loadRoomBtn">룸 데이터 불러오기</button><button class="ghost" id="openRoomBtn">룸 열기</button></div><div id="progress" class="progress hidden"></div></div>
<div class="section"><h2>2. 보기 옵션</h2><div class="grid2"><label class="chip"><input type="checkbox" id="showDate"> 날짜</label><label class="chip"><input type="checkbox" id="showTime" checked> 시간</label><label class="chip"><input type="checkbox" id="showAvatar" checked> 인장</label><label class="chip"><input type="checkbox" id="diceStyle" checked> 주사위</label><label class="chip"><input type="checkbox" id="diceSeparate"> 판정 로그 분리</label><label class="chip"><input type="checkbox" id="mergeSameChar"> 같은 캐릭터 이어쓰기</label></div><label>스킨</label><select id="skinMode"><option value="skin-dark">코코포리아 다크</option><option value="skin-light">코코포리아 라이트</option><option value="skin-tistory">티스토리 백업형</option><option value="skin-paper">리플북 종이풍</option></select><div class="grid2"><div><label>글자 크기</label><input id="fontSize" type="number" min="10" max="24" value="14"></div><div><label>배경색</label><input type="color" id="bgColor" value="#303136"></div></div></div>
<div class="section"><h2>3. 출력할 탭</h2><p class="hint">처음엔 아무것도 선택되어 있지 않습니다.</p><div id="tabList" class="list"><div class="hint">룸을 불러오면 탭이 표시됩니다.</div></div></div>
<div class="section"><h2>4. 탭 색</h2><div id="tabColorList" class="list"><div class="hint">탭별 색을 바꿀 수 있습니다.</div></div></div>
<div class="section"><h2>5. 시스템 캐릭터</h2><div id="systemList" class="list"><div class="hint">이름 없는 메시지도 여기에 뜹니다.</div></div></div>
<div class="section"><h2>6. 저장</h2><label>로그 제목</label><input id="titleInput" type="text"><div class="row" style="margin-top:8px"><button class="gray" id="downloadBtn">HTML 다운로드</button><button class="ghost" id="copyTistoryBtn">티스토리 HTML 복사</button></div></div>
</aside>
<main class="panel viewer"><div class="toolbar"><span id="status">아직 불러온 로그가 없습니다.</span><span id="count">0 items</span></div><div class="preview skin-dark" id="preview"><div class="empty">룸 ID/주소를 입력해서 로그를 불러오세요.</div></div></main>
</div></div>
<script>
let state={title:'',roomId:'',messages:[],characters:{},blocks:[]};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function log(m){const p=$('#progress');p.classList.remove('hidden');p.innerHTML+='<div>'+escapeHtml(m)+'</div>';p.scrollTop=p.scrollHeight}
function roomIdFrom(v){const t=String(v||'').trim();const m=t.match(/ccfolia\.com\/rooms(?:-v2)?\/([^/?#]+)/i);return m?decodeURIComponent(m[1]):t.replace(/^\/+|\/+$/g,'')}
function fsValue(v){if(!v||typeof v!=='object')return v;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return Number(v.doubleValue);if('booleanValue'in v)return Boolean(v.booleanValue);if('timestampValue'in v)return v.timestampValue;if('nullValue'in v)return null;if('arrayValue'in v)return(v.arrayValue.values||[]).map(fsValue);if('mapValue'in v)return fsFields(v.mapValue.fields||{});return v}
function fsFields(f){const o={};Object.entries(f||{}).forEach(([k,v])=>o[k]=fsValue(v));return o}
async function fetchJson(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()}
async function fetchCollection(roomId,col,pageSize=300){const base='https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/'+encodeURIComponent(roomId)+'/'+col+'/?pageSize='+pageSize;let all=[],token='';do{const d=await fetchJson(base+(token?'&pageToken='+encodeURIComponent(token):''));all=all.concat(d.documents||[]);token=d.nextPageToken||''}while(token);return all}
async function fetchRoomDoc(roomId){try{const d=await fetchJson('https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/'+encodeURIComponent(roomId));return d.fields?fsFields(d.fields):d}catch(e){return{}}}
function flat(o,p='',out={}){if(!o||typeof o!=='object')return out;Object.entries(o).forEach(([k,v])=>{const key=(p?p+'.':'')+k;out[key]=v;if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,key,out)});return out}
function first(o,keys){for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim()!=='')return o[k]}return''}
function activeIcon(ch){return ch&&ch.icons&&ch.icons.length?ch.icons[ch.activeIcon||0]:''}
function extractCharacter(doc,i){const f=doc.fields?fsFields(doc.fields):doc, fl=flat(f), id=String(doc.name||f.id||i).split('/').pop();const icon=first(fl,['iconUrl','imageUrl','portraitUrl','avatar','image','url','data.iconUrl','data.imageUrl']);return{id,name:first(fl,['name','data.name','character.name','displayName','label'])||id,icons:[icon].filter(Boolean),activeIcon:0,color:first(fl,['color','nameColor','textColor'])||'#f2f2f2',x:50,y:50,scale:100}}
function extractMessage(doc,i,cmap){const f=doc.fields?fsFields(doc.fields):doc, fl=flat(f), id=String(doc.name||f.id||i).split('/').pop();const cid=first(fl,['characterId','character','cid','speakerId','from.id','data.characterId']);const ch=cmap[cid]||{};return{id:'m_'+id,kind:'message',characterId:cid,name:first(fl,['name','speakerName','characterName','senderName','data.name','from.name'])||ch.name||'',icon:first(fl,['iconUrl','imageUrl','portraitUrl','avatar','image','data.iconUrl','from.iconUrl'])||activeIcon(ch)||'',color:first(fl,['color','nameColor','textColor'])||ch.color||'#f2f2f2',text:first(fl,['text','message','content','body','value','data.text'])||'',tab:String(first(fl,['tabName','tab','channelName','channel','roomChatTab','type','data.tab'])||'메인').trim()||'메인',created:first(fl,['createdAt','updatedAt','timestamp','data.createdAt'])||doc.createTime||doc.updateTime||'',avatarX:50,avatarY:50,avatarScale:100,deleted:false}}
async function loadRoom(){const id=roomIdFrom($('#roomInput').value);$('#progress').innerHTML='';if(!id){log('룸 ID를 입력해주세요.');return}try{state.roomId=id;log('룸 정보 확인 중...');const room=await fetchRoomDoc(id);state.title=$('#titleInput').value.trim()||room.name||room.title||id;let cdocs=[];try{cdocs=await fetchCollection(id,'characters')}catch(e){log('characters 접근 실패')}if(!cdocs.length){try{cdocs=await fetchCollection(id,'roomCharacters')}catch(e){}}const cmap={};cdocs.map(extractCharacter).forEach(c=>{cmap[c.id]=c;if(c.name)cmap[c.name]=c});state.characters=cmap;log('캐릭터 '+Object.values(cmap).filter((v,i,a)=>a.indexOf(v)===i).length+'개 확인');log('메시지 불러오는 중...');const mdocs=await fetchCollection(id,'messages');mdocs.sort((a,b)=>new Date(a.createTime||a.updateTime||0)-new Date(b.createTime||b.updateTime||0));state.messages=mdocs.map((d,i)=>extractMessage(d,i,cmap)).filter(m=>m.text||m.name);state.blocks=[];hydrateCharacters();buildTabs();buildSystemList();render();log('불러오기 성공: '+state.messages.length+'개 메시지')}catch(e){console.error(e);log('불러오기 실패: '+e.message)}}
function getChar(k){return state.characters[k]||state.characters[String(k)]||null}
function hydrateCharacters(){state.messages.forEach(m=>{const k=m.characterId||m.name||'__blank_name__';if(!state.characters[k])state.characters[k]={id:k,name:m.name||k,icons:[m.icon].filter(Boolean),activeIcon:0,color:m.color||'#f2f2f2',x:50,y:50,scale:100};const c=state.characters[k];if((!c.name||c.name===c.id)&&m.name)c.name=m.name;if(m.icon&&!c.icons.includes(m.icon))c.icons.push(m.icon)})}
function uniqueChars(){const seen=new Set(),list=[];state.messages.forEach(m=>{const k=m.characterId||m.name||'__blank_name__';if(seen.has(k))return;seen.add(k);const c=getChar(k)||{};list.push({id:k,name:c.name||m.name||(m.icon?'(이름 없음 / 인장 있음)':'(이름 없음)')})});return list}
function tabColor(n){let s=0;for(let i=0;i<n.length;i++)s+=n.charCodeAt(i);return['#806a58','#5e6f8a','#6d7f5f','#8a5e6f','#7b6d8f','#887a54','#5d7f79'][s%7]}
function buildTabs(){const names=[];state.messages.forEach(m=>{if(!names.includes(m.tab))names.push(m.tab)});$('#tabList').innerHTML=names.map(n=>'<label class="chip"><input type="checkbox" class="outputTab" value="'+escapeHtml(n)+'"> '+escapeHtml(n)+'</label>').join('')||'<div class="hint">탭 없음</div>';$('#tabColorList').innerHTML=names.map(n=>'<div class="tab-color-row"><label class="chip">'+escapeHtml(n)+'</label><input type="color" class="tabColorInput" data-tab="'+escapeHtml(n)+'" value="'+escapeHtml(localStorage.getItem('tabColor_'+n)||tabColor(n))+'"></div>').join('')||'<div class="hint">탭 없음</div>'}
function buildSystemList(){const list=uniqueChars();$('#systemList').innerHTML=list.map(c=>'<label class="chip"><input type="checkbox" class="systemChar" value="'+escapeHtml(c.id)+'"> '+escapeHtml(c.name)+'</label>').join('')||'<div class="hint">캐릭터 없음</div>'}
function selectedTabs(){return $$('#tabList .outputTab').filter(i=>i.checked).map(i=>i.value)}
function selectedSystem(){return new Set($$('#systemList .systemChar:checked').map(i=>i.value))}
function isSystem(m,set){return set.has(m.characterId)||set.has(m.name)||(set.has('__blank_name__')&&!m.name)||(!m.name&&!m.icon)}
function isDiceText(t){return /cc<=?\d+|ccb<=?\d+|1D100<=?\d+|\d+D\d+|보너스, 패널티 주사위|＞|SAN|SC|S?choice|choice/i.test(String(t||''))}
function enhanceDice(text){let h=escapeHtml(text);if(!$('#diceStyle').checked)return h;h=h.replace(/(cc&lt;=?\d+\s*[^\n＞]*|ccb&lt;=?\d+\s*[^\n＞]*|\(1D100&lt;=?\d+\)|\d+D\d+|보너스, 패널티 주사위\[[-+]?\d+\]|＞|성공|실패|대성공|대실패|펌블|SAN|SC|S?choice|choice)/gi,m=>/성공|실패|대성공|대실패|펌블/i.test(m)?'<span class="dice-result">'+m+'</span>':'<span class="dice-macro">'+m+'</span>');return h}
function formatDT(v){if(!v)return{date:'',time:''};const d=new Date(v);if(isNaN(d))return{date:'',time:String(v)};return{date:d.toLocaleDateString(),time:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}}
function meta(v){const d=formatDT(v),p=[];if($('#showDate').checked&&d.date)p.push(d.date);if($('#showTime').checked&&d.time)p.push(d.time);return p.join(' ')}
function allItems(){const tabs=selectedTabs();return state.messages.filter(m=>!m.deleted&&tabs.includes(m.tab)).concat(state.blocks.filter(b=>!b.deleted)).sort((a,b)=>new Date(a.created||0)-new Date(b.created||0))}
function insertControl(afterId){const id=escapeHtml(afterId||'start');return '<div class="insert-toggle"><button onclick="toggleInsertControl(\''+id+'\')">＋</button></div><div class="insert-control" id="insert_'+id+'"><button onclick="addChatAfter(\''+id+'\')">채팅+</button><button onclick="openImageModal(\''+id+'\')">이미지+</button><button onclick="openBgmModal(\''+id+'\')">BGM+</button></div>'}
function groupItems(items,sys){if(!$('#mergeSameChar').checked)return items;const out=[];items.forEach(it=>{const last=out[out.length-1];if(it.kind==='message'&&last&&last.kind==='message'&&!isSystem(it,sys)&&!isSystem(last,sys)&&(last.characterId||last.name)===(it.characterId||it.name)&&last.tab===it.tab){last.text+='\n'+it.text}else out.push({...it})});return out}
function render(){const preview=$('#preview');preview.className='preview '+$('#skinMode').value;document.documentElement.style.setProperty('--cc-bg',$('#bgColor').value||'#303136');const sys=selectedSystem();let items=groupItems(allItems(),sys);$('#status').textContent=$('#titleInput').value.trim()||state.title||'custom log';$('#count').textContent=items.length+' items';if(!items.length){preview.innerHTML='<div class="empty">'+(selectedTabs().length?'선택한 탭에 출력할 메시지가 없습니다.':'왼쪽의 출력할 탭을 체크하면 미리보기가 표시됩니다.')+'</div>';return}let html='<div class="log-title">'+escapeHtml($('#titleInput').value.trim()||state.title||'CCFOLIA LOG')+'</div>'+insertControl('start');items.forEach((it,idx)=>{if(it.kind==='image')html+=renderImageBlock(it)+insertControl(it.id);else if(it.kind==='bgm')html+=renderBgmBlock(it)+insertControl(it.id);else html+=renderMessage(it,sys,idx,items)+insertControl(it.id)});preview.innerHTML=html;attachBgm()}
function renderMessage(m,sys,idx,items){const c=getChar(m.characterId||m.name)||{};const system=isSystem(m,sys);const dice=$('#diceSeparate').checked&&isDiceText(m.text);const icon=m.icon||activeIcon(c);const showAvatar=$('#showAvatar').checked&&icon&&!system&&!dice;const x=Number(m.avatarX||c.x||50),y=Number(m.avatarY||c.y||50),scale=Number(m.avatarScale||c.scale||100)/100;const av=showAvatar?'<div class="cc-avatar"><img src="'+escapeHtml(icon)+'" style="object-position:'+x+'% '+y+'%;transform:scale('+scale+')"></div>':'<div></div>';const mt=meta(m.created);const displayName=m.name||c.name||'';const name=system||dice?'':'<div class="cc-name-line"><span class="cc-name" style="color:'+escapeHtml(m.color||c.color||'#f2f2f2')+'">'+escapeHtml(displayName)+'</span>'+(mt?'<span class="cc-meta">'+escapeHtml(mt)+'</span>':'')+'</div>';const sm=system&&mt?'<span class="cc-meta">'+escapeHtml(mt)+'</span> ':'';const tools='<div class="inline-tools"><button class="ghost small" onclick="toggleEdit(\''+m.id+'\')">✎ 수정</button><button class="ghost small" onclick="openImageModal(\''+m.id+'\')">이미지+</button><button class="ghost small" onclick="openBgmModal(\''+m.id+'\')">BGM+</button><button class="ghost small" onclick="addChatAfter(\''+m.id+'\')">채팅+</button><button class="danger small" onclick="deleteItem(\''+m.id+'\')">삭제</button></div>';const editor='<div class="inline-editor hidden" id="editor_'+m.id+'"><input value="'+escapeHtml(displayName)+'" onchange="editMsg(\''+m.id+'\',\'name\',this.value)" placeholder="이름"><input value="'+escapeHtml(icon)+'" onchange="editMsg(\''+m.id+'\',\'icon\',this.value)" placeholder="인장 URL"><textarea onchange="editMsg(\''+m.id+'\',\'text\',this.value)">'+escapeHtml(m.text)+'</textarea><div class="grid2"><input type="number" value="'+x+'" onchange="editMsg(\''+m.id+'\',\'avatarX\',Number(this.value))" placeholder="인장 X"><input type="number" value="'+y+'" onchange="editMsg(\''+m.id+'\',\'avatarY\',Number(this.value))" placeholder="인장 Y"></div><input type="number" value="'+Number(m.avatarScale||c.scale||100)+'" onchange="editMsg(\''+m.id+'\',\'avatarScale\',Number(this.value))" placeholder="인장 확대율"></div>';const color='--dice-color:'+escapeHtml(m.color||c.color||'rgba(255,255,255,.64)');return '<article class="cc-row '+(system?'system ':'')+(dice?'dice-log ':'')+(showAvatar?'':'no-avatar')+'" style="'+color+'">'+(system||dice?'':av)+'<div class="cc-body">'+name+'<p class="cc-text" style="font-size:'+(Number($('#fontSize').value)||14)+'px">'+sm+enhanceDice(m.text)+'</p>'+tools+editor+'</div></article>'}
function renderImageBlock(b){return '<div class="custom-block"><img class="insert-image" src="'+escapeHtml(b.url)+'" style="--img-width:'+escapeHtml(b.width||70)+'%"><div class="caption">'+escapeHtml(b.caption||'')+'</div><div class="inline-tools"><button class="ghost small" onclick="editBlock(\''+b.id+'\')">✎ 이미지 수정</button><button class="danger small" onclick="deleteItem(\''+b.id+'\')">삭제</button></div></div>'}
function renderBgmBlock(b){return '<div class="custom-block"><div class="bgm-area"><button class="bgmButton" data-audio="'+escapeHtml(b.url)+'">♪ '+escapeHtml(b.label||bgmTitle(b.url))+'</button></div><div class="inline-tools"><button class="ghost small" onclick="editBlock(\''+b.id+'\')">✎ BGM 수정</button><button class="danger small" onclick="deleteItem(\''+b.id+'\')">삭제</button></div></div>'}
function insertAfter(afterId,item){const items=allItems();let time=new Date().toISOString();if(afterId&&afterId!=='start'){const base=items.find(x=>x.id===afterId);if(base&&base.created)time=new Date(new Date(base.created).getTime()+1).toISOString()}item.created=time;state.blocks.push(item);render()}
function toggleInsertControl(id){const el=$('#insert_'+id);if(el)el.classList.toggle('active')}
function openModal(html){const old=$('#modalRoot');if(old)old.remove();const w=document.createElement('div');w.id='modalRoot';w.className='modal-backdrop';w.innerHTML='<div class="modal-box">'+html+'</div>';document.body.appendChild(w);w.onclick=e=>{if(e.target===w)w.remove()}}
function closeModal(){const m=$('#modalRoot');if(m)m.remove()}
function openImageModal(afterId,blockId){const b=blockId?state.blocks.find(x=>x.id===blockId):null;openModal('<h3>이미지 추가/수정</h3><label>이미지 URL</label><input id="modalImageUrl" value="'+escapeHtml(b?b.url:'')+'"><label>이미지 크기(%)</label><input id="modalImageWidth" type="number" value="'+escapeHtml(b?b.width||70:70)+'"><label>캡션</label><input id="modalImageCaption" value="'+escapeHtml(b?b.caption||'':'')+'"><div class="row" style="margin-top:10px"><button onclick="saveImageModal(\''+escapeHtml(afterId||'start')+'\',\''+escapeHtml(blockId||'')+'\')">저장</button><button class="ghost" onclick="closeModal()">취소</button></div>')}
function saveImageModal(afterId,blockId){const url=$('#modalImageUrl').value.trim();if(!url)return alert('이미지 URL을 넣어주세요.');const width=$('#modalImageWidth').value||70,caption=$('#modalImageCaption').value||'';if(blockId){const b=state.blocks.find(x=>x.id===blockId);if(b){b.url=url;b.width=width;b.caption=caption}}else insertAfter(afterId,{id:'b_'+Date.now(),kind:'image',url,width,caption,deleted:false});closeModal();render()}
function openBgmModal(afterId,blockId){const b=blockId?state.blocks.find(x=>x.id===blockId):null;openModal('<h3>BGM 추가/수정</h3><label>버튼 이름</label><input id="modalBgmLabel" value="'+escapeHtml(b?b.label:'')+'"><label>mp3 링크</label><input id="modalBgmUrl" value="'+escapeHtml(b?b.url:'')+'"><div class="row" style="margin-top:10px"><button onclick="saveBgmModal(\''+escapeHtml(afterId||'start')+'\',\''+escapeHtml(blockId||'')+'\')">저장</button><button class="ghost" onclick="closeModal()">취소</button></div>')}
function saveBgmModal(afterId,blockId){const url=$('#modalBgmUrl').value.trim();if(!url)return alert('mp3 링크를 넣어주세요.');const label=$('#modalBgmLabel').value.trim()||bgmTitle(url);if(blockId){const b=state.blocks.find(x=>x.id===blockId);if(b){b.url=url;b.label=label}}else insertAfter(afterId,{id:'b_'+Date.now(),kind:'bgm',url,label,deleted:false});closeModal();render()}
function addChatAfter(id){const name=prompt('캐릭터 이름');if(name===null)return;const text=prompt('내용');if(text===null)return;insertAfter(id,{id:'m_custom_'+Date.now(),kind:'message',characterId:name,name,text,icon:'',color:'#f2f2f2',tab:selectedTabs()[0]||'메인',created:new Date().toISOString(),avatarX:50,avatarY:50,avatarScale:100,deleted:false})}
function editBlock(id){const b=state.blocks.find(x=>x.id===id);if(!b)return;if(b.kind==='image')openImageModal('start',id);else if(b.kind==='bgm')openBgmModal('start',id)}
function toggleEdit(id){const e=$('#editor_'+id);if(e)e.classList.toggle('hidden')}
function editMsg(id,field,value){const m=state.messages.find(x=>x.id===id);if(!m)return;m[field]=value;render()}
function deleteItem(id){if(!confirm('삭제할까요?'))return;const m=state.messages.find(x=>x.id===id);if(m)m.deleted=true;const b=state.blocks.find(x=>x.id===id);if(b)b.deleted=true;render()}
function bgmTitle(url){try{return decodeURIComponent(url.split('/').pop().split('?')[0]).replace(/\.(mp3|wav|ogg)$/i,'')||'BGM'}catch(e){return'BGM'}}
function attachBgm(){let current=null;$$('.bgmButton').forEach(btn=>btn.onclick=()=>{const src=btn.dataset.audio;if(current){current.pause();current.currentTime=0}if(btn.dataset.playing==='1'){btn.dataset.playing='0';return}$$('.bgmButton').forEach(b=>b.dataset.playing='0');current=new Audio(src);current.loop=true;current.play();btn.dataset.playing='1'})}
function cleanForExport(html){return html.replace(/<div class="insert-toggle"[\s\S]*?<\/div>/g,'').replace(/<div class="insert-control"[\s\S]*?<\/div>/g,'').replace(/<div class="inline-tools"[\s\S]*?<\/div>/g,'').replace(/<div class="inline-editor[\s\S]*?<\/div>/g,'')}
function bgmExportScript(){return '<scr'+'ipt>let currentAudio=null;document.querySelectorAll(".bgmButton").forEach(function(btn){btn.addEventListener("click",function(){var src=btn.dataset.audio;if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}if(btn.dataset.playing==="1"){btn.dataset.playing="0";return}document.querySelectorAll(".bgmButton").forEach(function(b){b.dataset.playing="0"});currentAudio=new Audio(src);currentAudio.loop=true;currentAudio.play();btn.dataset.playing="1"})});</scr'+'ipt>'}
function exportHtml(){render();const title=$('#titleInput').value.trim()||state.title||'custom_log';const cls='preview '+$('#skinMode').value;return '<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>'+escapeHtml(title)+'</title><style>'+document.querySelector('style').textContent+'</style></head><body><main class="'+cls+'">'+cleanForExport($('#preview').innerHTML)+'</main>'+bgmExportScript()+'</body></html>'}
function exportTistoryHtml(){render();const cls='preview '+$('#skinMode').value;return '<style>'+document.querySelector('style').textContent+'.tistory-ccfolia-backup{width:100vw!important;max-width:100vw!important;margin-left:calc(50% - 50vw)!important;margin-right:calc(50% - 50vw)!important;border-radius:0!important;}</style><div class="tistory-ccfolia-backup '+cls+'">'+cleanForExport($('#preview').innerHTML)+'</div>'+bgmExportScript()}
function downloadHtml(){const blob=new Blob([exportHtml()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ccfolia_backup_'+String(state.roomId||'log').replace(/[^\w가-힣.-]+/g,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function copyTistory(){await navigator.clipboard.writeText(exportTistoryHtml());alert('티스토리용 HTML을 복사했어요. HTML 모드에 붙여넣어주세요.')}
window.toggleEdit=toggleEdit;window.editMsg=editMsg;window.deleteItem=deleteItem;window.addChatAfter=addChatAfter;window.editBlock=editBlock;window.toggleInsertControl=toggleInsertControl;window.openImageModal=openImageModal;window.openBgmModal=openBgmModal;window.saveImageModal=saveImageModal;window.saveBgmModal=saveBgmModal;window.closeModal=closeModal;
document.addEventListener('DOMContentLoaded',()=>{$('#loadRoomBtn').onclick=loadRoom;$('#openRoomBtn').onclick=()=>{const id=roomIdFrom($('#roomInput').value);if(!id){log('룸 ID를 입력해주세요.');return}window.open('https://ccfolia.com/rooms/'+encodeURIComponent(id),'_blank')};$('#downloadBtn').onclick=downloadHtml;$('#copyTistoryBtn').onclick=copyTistory;['showDate','showTime','showAvatar','diceStyle','diceSeparate','mergeSameChar','skinMode','fontSize','bgColor','titleInput'].forEach(id=>{const el=$('#'+id);if(el){el.addEventListener('input',render);el.addEventListener('change',render)}});$('#tabList').addEventListener('change',render);$('#systemList').addEventListener('change',render);$('#tabColorList').addEventListener('input',e=>{if(e.target.classList.contains('tabColorInput'))localStorage.setItem('tabColor_'+e.target.dataset.tab,e.target.value);render()})});
</script>
</body>
